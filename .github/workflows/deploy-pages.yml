name: 自动编译并发布交互式看板至 GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 编译统一交互式门户主页
        run: python3 算法与配置/build_portal.py

      - name: 组装在线网页站点目录
        run: |
          mkdir -p _site
          cp -r 交互式看板/* _site/
          cp -r 每日投研报告 _site/
          cp -r 资讯栏目 _site/
          cp -r 国债利差专题 _site/

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上传网页构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: 发布上线交互式页面
        id: deployment
        uses: actions/deploy-pages@v4
